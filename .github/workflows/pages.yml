name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Skip build/deploy; only run the live check against the current live site'
        type: boolean
        default: false
      expected_sha:
        description: 'check_only: commit the live footer must show (default: this run SHA)'
        required: false
      url:
        description: 'check_only: URL to check (default: live tool)'
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  WASM_BINDGEN_VERSION: 0.2.129   # must match wasm-bindgen in Cargo.lock
jobs:
  build:
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install wasm-bindgen-cli
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: Check wasm-bindgen version matches Cargo.lock
        run: grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep -q "version = \"$WASM_BINDGEN_VERSION\""
      - name: Native tests (incl. GB/T 32918.2 vector)
        run: cargo test --release --locked
      - name: Build wasm
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir www/pkg target/wasm32-unknown-unknown/release/gm_web.wasm
          ls -l www/pkg
      - name: Decode share image (og.png is stored as base64 text; the connector used to push cannot carry binary)
        run: |
          base64 -d www/og.png.b64 > www/og.png
          sha256sum www/og.png
          rm www/og.png.b64
      - name: Stamp commit into footer and HTML comment
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          sed -i "s/__COMMIT__/$SHORT/g" www/index.html
          grep -q "<!-- commit: $SHORT -->" www/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    # Runs after a real deploy, or alone when dispatched with check_only (never touches the site).
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || (inputs.check_only && needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        working-directory: pw
        run: npm install --no-audit --no-fund && npx playwright-core install --with-deps chromium
      - name: Live check (zh + en, badge 11/11, footer commit)
        working-directory: pw
        env:
          LIVE_URL: ${{ inputs.url || 'https://www.frankxue.dev/gm-crypto-web/' }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          EXPECTED_CASES: '11'
          DEADLINE_S: '300'
        run: node live-check.cjs
