<style>

#stbadge.bad{border-color:var(--err);color:var(--err);background:#fdecea}
.howto{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.9rem}

main{display:grid;grid-template-columns:1fr;gap:14px}

select{width:auto;font-family:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.out{position:relative}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
