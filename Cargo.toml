[package]
name = "gm-web"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frankxue831/gm-crypto-web"
publish = false
version = "0.0.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
gmcrypto-core = { git = "https://github.com/frankxue831/gm-crypto-rs", rev = "41d54a505071de7103f7ac1c55aa9903479a80cb" }
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js", "sys_rng"] }
rand_core = "0.10"
[workspace]
[profile.release]
opt-level = "s"
lto = true
